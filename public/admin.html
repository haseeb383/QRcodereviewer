<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Smart Review Cards - Admin Dashboard</title>
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <div class="container">
    <header>
      <h1>📋 Smart Review Cards</h1>
      <p class="subtitle">Admin Dashboard</p>
    </header>

    <div id="login-screen" class="screen active">
      <div class="login-box">
        <h2>Sign In</h2>
        <input type="password" id="password" placeholder="Enter admin password" autocomplete="current-password">
        <button id="login-btn" class="btn primary">Login</button>
        <p id="login-error" class="error hidden"></p>
      </div>
    </div>

    <div id="dashboard-screen" class="screen hidden">
      <div class="toolbar">
        <div class="search-box">
          <input type="text" id="search" placeholder="Search cards...">
        </div>
        <div class="filter-box">
          <select id="status-filter">
            <option value="">All Status</option>
            <option value="active">Active</option>
            <option value="inactive">Inactive</option>
          </select>
        </div>
        <button id="generate-btn" class="btn secondary">Generate More Cards</button>
      </div>

      <div class="table-wrapper">
        <table id="cards-table">
          <thead>
            <tr>
              <th>Card ID</th>
              <th>Client Name</th>
              <th>Status</th>
              <th>Destination URL</th>
              <th>Actions</th>
            </tr>
          </thead>
          <tbody id="cards-body"></tbody>
        </table>
      </div>

      <div id="pagination" class="pagination"></div>
    </div>
  </div>

  <div id="edit-modal" class="modal hidden">
    <div class="modal-content">
      <h2>Edit Card <span id="modal-card-id"></span></h2>
      <form id="edit-form">
        <input type="hidden" id="edit-card-id">
        <div class="form-group">
          <label>Client Name</label>
          <input type="text" id="edit-client-name" placeholder="Business name">
        </div>
        <div class="form-group">
          <label>Google Review URL</label>
          <input type="url" id="edit-destination-url" placeholder="https://g.page/... or https://maps.google.com/...">
        </div>
        <div class="form-group">
          <label>Status</label>
          <select id="edit-status">
            <option value="inactive">Inactive</option>
            <option value="active">Active</option>
          </select>
        </div>
        <div class="modal-actions">
          <button type="button" class="btn secondary" id="cancel-btn">Cancel</button>
          <button type="submit" class="btn primary">Save & Activate</button>
        </div>
      </form>
    </div>
  </div>

  <div id="generate-modal" class="modal hidden">
    <div class="modal-content">
      <h2>Generate New Cards</h2>
      <form id="generate-form">
        <div class="form-group">
          <label>Start Number</label>
          <input type="number" id="gen-start" value="101" min="1" max="999">
        </div>
        <div class="form-group">
          <label>End Number</label>
          <input type="number" id="gen-end" value="200" min="1" max="999">
        </div>
        <div class="modal-actions">
          <button type="button" class="btn secondary" id="cancel-gen-btn">Cancel</button>
          <button type="submit" class="btn primary">Generate</button>
        </div>
      </form>
    </div>
  </div>

  <script src="/app.js"></script>
</body>
</html>
